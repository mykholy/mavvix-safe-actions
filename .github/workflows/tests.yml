name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '^12.0', testbench: '^10.0' }
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^13.0', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: |
          composer validate --strict
          composer require --no-interaction --no-update --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
      - name: Run tests
        run: vendor/bin/phpunit
      - name: Verify formatting
        run: vendor/bin/pint --test

      - name: Show suggested Pint changes
        if: failure()
        run: |
          vendor/bin/pint
          git --no-pager diff -- src tests

  mysql:
    name: MySQL 8 / Laravel 12
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: safe_actions_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: safe_actions_test
      DB_USERNAME: root
      DB_PASSWORD: root
      SAFE_ACTIONS_EXPECTED_DRIVER: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pcntl, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update --dev "laravel/framework:^12.0" "orchestra/testbench:^10.0"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
      - name: Run MySQL tests
        run: vendor/bin/phpunit
      - name: Verify independent MySQL transactions
        run: vendor/bin/phpunit --filter ConcurrentExecutionTest --fail-on-skipped
      - name: Benchmark bounded MySQL operations (single and repeated)
        env:
          SAFE_ACTIONS_BENCHMARK_REPORT: ${{ runner.temp }}/safe-actions-bench-mysql.jsonl
        run: vendor/bin/phpunit --filter PerformanceBenchmarkTest --fail-on-skipped
      - name: Concurrent MySQL confirmation load (independent PDO workers)
        env:
          SAFE_ACTIONS_CONCURRENT_REPORT: ${{ runner.temp }}/safe-actions-concurrent-mysql.jsonl
        run: vendor/bin/phpunit --filter ConcurrentLoadTest --fail-on-skipped
      - uses: actions/upload-artifact@v7
        with:
          name: safe-actions-concurrent-mysql
          path: ${{ runner.temp }}/safe-actions-concurrent-mysql.jsonl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: safe-actions-bench-mysql
          path: ${{ runner.temp }}/safe-actions-bench-mysql.jsonl
          if-no-files-found: error

  postgres:
    name: PostgreSQL 16 / Laravel 12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safe_actions_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d safe_actions_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: safe_actions_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SAFE_ACTIONS_EXPECTED_DRIVER: pgsql
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql, pcntl, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update --dev "laravel/framework:^12.0" "orchestra/testbench:^10.0"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
      - name: Run PostgreSQL tests
        run: vendor/bin/phpunit
      - name: Verify independent PostgreSQL transactions
        run: vendor/bin/phpunit --filter ConcurrentExecutionTest --fail-on-skipped
      - name: Benchmark bounded PostgreSQL operations (single and repeated)
        env:
          SAFE_ACTIONS_BENCHMARK_REPORT: ${{ runner.temp }}/safe-actions-bench-postgres.jsonl
        run: vendor/bin/phpunit --filter PerformanceBenchmarkTest --fail-on-skipped
      - name: Concurrent PostgreSQL confirmation load (independent PDO workers)
        env:
          SAFE_ACTIONS_CONCURRENT_REPORT: ${{ runner.temp }}/safe-actions-concurrent-postgres.jsonl
        run: vendor/bin/phpunit --filter ConcurrentLoadTest --fail-on-skipped
      - uses: actions/upload-artifact@v7
        with:
          name: safe-actions-concurrent-postgres
          path: ${{ runner.temp }}/safe-actions-concurrent-postgres.jsonl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: safe-actions-bench-postgres
          path: ${{ runner.temp }}/safe-actions-bench-postgres.jsonl
          if-no-files-found: error
