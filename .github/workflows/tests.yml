name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^13.0', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, dom, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: |
          composer validate --strict
          composer require --no-interaction --no-update --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
      - name: Run tests
        run: vendor/bin/phpunit --debug
      - name: Verify formatting
        run: vendor/bin/pint --test
